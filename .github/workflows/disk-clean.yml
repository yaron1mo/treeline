name: Disk clean
# Clears caches on Yaroslav's Windows computer (self-hosted runner), by hand only (Yaroslav approved, 2026-11-27):
# the npm cache, the user Temp folder (files in use are skipped), the uv cache. Only caches: programs make them again.
# Reports free space before and after as a comment on the given issue.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number for the report'
        required: true

jobs:
  clean:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 40
    permissions:
      issues: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"   # npm and uv write notes to stderr; that is not an error
          function Free { "{0:N1} GB" -f ((Get-PSDrive C).Free / 1GB) }
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add("### Cache clean")
          $out.Add("- Free on C before: $(Free)")
          cmd /c "npm cache clean --force >nul 2>&1"; $out.Add("- npm cache: exit $LASTEXITCODE")
          $before = (Get-ChildItem -LiteralPath $env:TEMP -Force -ErrorAction SilentlyContinue | Measure-Object).Count
          Get-ChildItem -LiteralPath $env:TEMP -Force -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          $after = (Get-ChildItem -LiteralPath $env:TEMP -Force -ErrorAction SilentlyContinue | Measure-Object).Count
          $out.Add("- Temp: $before items before, $after left (in use)")
          cmd /c "uv cache clean >nul 2>&1"; $out.Add("- uv cache: exit $LASTEXITCODE")
          $out.Add("- Free on C after: $(Free)")
          $f = "$env:RUNNER_TEMP\clean.md"
          [System.IO.File]::WriteAllLines($f, $out, (New-Object System.Text.UTF8Encoding $false))
          Get-Content $f
          gh issue comment ${{ github.event.inputs.issue }} --repo ${{ github.repository }} --body-file $f

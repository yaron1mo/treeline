name: Telegram images
# Sends new concept art, previews and map images to Yaroslav's Telegram when an agent pushes them (2026-11-27).
# Art (docs/design/visual/**) goes as a document: Telegram does not compress it, so pixel details stay exact.
# Map previews go as photos. At most 10 images per push. By hand: resend files of a branch that match a pattern.
on:
  push:
    branches: ['codex/**', 'mistral/**', 'design/**']
    paths:
      - 'docs/design/visual/**'
      - 'docs/maps/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch'
        required: true
      pattern:
        description: 'Path pattern (grep -E), for example docs/design/visual/density/'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          lfs: true
      - name: Send the images
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.event.inputs.ref || github.ref_name }}
          PATTERN: ${{ github.event.inputs.pattern }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "No Telegram secrets"; exit 1; fi
          if [ -n "$PATTERN" ]; then
            git ls-files | grep -E "$PATTERN" | grep -iE '\.(png|jpe?g|webp|gif)$' | head -20 > images.txt || true
          else
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE=$(git merge-base origin/codex/playable-steppe-patch-integration "$AFTER" 2>/dev/null || git rev-list --max-parents=0 "$AFTER" | tail -1)
            fi
            git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'docs/design/visual/*' 'docs/maps/*' \
              | grep -iE '\.(png|jpe?g|webp|gif)$' | head -10 > images.txt || true
          fi
          echo "Images:"; cat images.txt
          while read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.gif|*.GIF) method=sendAnimation; field=animation ;;
              docs/design/visual/*) method=sendDocument; field=document ;;
              *) method=sendPhoto; field=photo ;;
            esac
            [ "$(stat -c %s "$f")" -gt 9500000 ] && { method=sendDocument; field=document; }
            resp=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/${method}" \
              -F "chat_id=${TG_CHAT}" -F "${field}=@${f}" -F "caption=🎨 ${BRANCH}: ${f}")
            echo "$f: $(echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("ok"), d.get("description",""))')"
          done < images.txt

name: Telegram images
# Sends new concept art, previews and map images to Yaroslav's Telegram when an agent pushes them (2026-11-27).
# Paths: docs/design/visual/**, docs/maps/**. At most 10 images per push.
on:
  push:
    branches: ['codex/**', 'mistral/**', 'design/**']
    paths:
      - 'docs/design/visual/**'
      - 'docs/maps/**'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Send the new images
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "No Telegram secrets"; exit 1; fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git merge-base origin/codex/playable-steppe-patch-integration "$AFTER" 2>/dev/null || git rev-list --max-parents=0 "$AFTER" | tail -1)
          fi
          git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'docs/design/visual/*' 'docs/maps/*' \
            | grep -iE '\.(png|jpe?g|webp)$' | head -10 > images.txt || true
          echo "Images:"; cat images.txt
          while read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt 9500000 ]; then method=sendDocument; field=document; else method=sendPhoto; field=photo; fi
            resp=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/${method}" \
              -F "chat_id=${TG_CHAT}" -F "${field}=@${f}" -F "caption=🎨 ${BRANCH}: ${f}")
            echo "$f: $(echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("ok"), d.get("description",""))')"
          done < images.txt

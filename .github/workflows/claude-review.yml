name: Claude review
# Agent office, stage 0 (2026-11-26). Claude reviews each pull request from a mistral/** or codex/** branch when it opens
# or becomes ready. For a new review after changes, write "@claude review" in a PR comment (workflow claude.yml).
# Auth: the CLAUDE_CODE_OAUTH_TOKEN secret (Yaroslav's Claude subscription, `claude setup-token`). No API billing.
# Rules: docs/agents/office.md.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: (startsWith(github.head_ref, 'mistral/') || startsWith(github.head_ref, 'codex/') || startsWith(github.head_ref, 'design/')) && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are Claude, CTO of the Treeline team. Review pull request #${{ github.event.pull_request.number }}
            (branch ${{ github.head_ref }} into ${{ github.base_ref }}) in ${{ github.repository }}.
            Follow docs/agents/office.md, section "Review". Read AGENTS.md and the task spec of the author
            (docs/agents/mistral.md for mistral/**, the linked issue for codex/**, docs/agents/designer.md for design/**: check only that the proposal can be built and measured; the design decision is Yaroslav's). Write in ASD-STE100.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(bash tools/tests/*),Bash(python3:*),Read,Grep,Glob"

name: Notify
# Agent office (2026-11-27). Telegram messages to Yaroslav: an issue or PR gets "needs:yaroslav", a PR merges, an agent
# run fails. Secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID; without them this does nothing.
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled, closed]
  workflow_run:
    workflows: ["Mistral task", "Codex task", "Auto-merge", "Dispatcher"]
    types: [completed]

jobs:
  telegram:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'needs:yaroslav') ||
      (github.event.action == 'closed' && github.event.pull_request.merged) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.name == 'Mistral task' || github.event.workflow_run.name == 'Codex task')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        (github.event.label.name == 'agent:mistral' || github.event.label.name == 'agent:codex'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ISSUE_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_OK: ${{ github.event.workflow_run.conclusion }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "No Telegram secrets: token set=$([ -n "$TG_TOKEN" ] && echo yes || echo no), chat set=$([ -n "$TG_CHAT" ] && echo yes || echo no)"; exit 1; fi
          if [ "$EVENT" = "workflow_run" ] && [ "$RUN_OK" = "success" ]; then
            msg="🏁 $RUN_NAME завершено: $RUN_TITLE
          Далі: рев'ю Claude в PR.
          $RUN_URL"
          elif [ "$EVENT" = "workflow_run" ]; then
            msg="❌ Збій: $RUN_NAME — $RUN_TITLE
          $RUN_URL"
          elif [ "$LABEL" = "agent:mistral" ] || [ "$LABEL" = "agent:codex" ]; then
            msg="▶️ Старт ${LABEL#agent:}: $ISSUE_TITLE
          $ISSUE_URL"
          elif [ "$ACTION" = "closed" ]; then
            msg="✅ Змержено: $ISSUE_TITLE
          $ISSUE_URL"
          else
            msg="🟠 Потрібне твоє рішення: $ISSUE_TITLE
          $ISSUE_URL"
          fi
          resp=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${msg}" \
            --data-urlencode "disable_web_page_preview=true")
          # Print only ok and the error text, never the token.
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("telegram ok:", d.get("ok"), d.get("description", "")); sys.exit(0 if d.get("ok") else 1)'

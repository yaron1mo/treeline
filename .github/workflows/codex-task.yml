name: Codex task
# Agent office, stage 2 (2026-11-27). The label "agent:codex" on an issue starts Codex CLI on Yaroslav's Windows computer
# (a self-hosted Windows runner), with his own ChatGPT login (codex login). No API key. One Codex task at a time.
# Two runners on the same computer let Codex and Mistral work at the same time.
# Codex pushes and opens the PR with Yaroslav's own git and gh login (not GITHUB_TOKEN), so Claude sees the PR.
on:
  issues:
    types: [labeled]

concurrency:
  group: codex
  cancel-in-progress: false

jobs:
  task:
    if: github.event.label.name == 'agent:codex'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the task file
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
        run: |
          $lines = @(
            "You are Codex, Chief Design Officer of the Treeline team (visuals, UI, art, renderer). Read AGENTS.md first.",
            "Your task is GitHub issue #$env:NUM : $env:TITLE",
            "",
            $env:BODY,
            "",
            "Work on a branch codex/<topic>. When you finish: push the branch and open a pull request into codex/playable-steppe-patch-integration with gh.",
            "Then write a comment on issue #$env:NUM with the PR link. If you need a design decision, add the label needs:yaroslav to the issue and stop."
          )
          [System.IO.File]::WriteAllLines("$env:RUNNER_TEMP\codex-task.md", $lines, (New-Object System.Text.UTF8Encoding $false))
      - name: Mark in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label in-progress
      - name: Run Codex
        run: |
          Get-Content "$env:RUNNER_TEMP\codex-task.md" -Raw | codex exec --dangerously-bypass-approvals-and-sandbox --json - | Tee-Object -FilePath "$env:RUNNER_TEMP\codex-events.jsonl" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label in-progress --remove-label agent:codex
          $usage = "{}"
          $f = "$env:RUNNER_TEMP\codex-events.jsonl"
          if (Test-Path $f) { $u = Get-Content $f | Where-Object { $_ -match '"usage"' } | Select-Object -Last 1; if ($u) { try { $usage = (($u | ConvertFrom-Json).usage | ConvertTo-Json -Compress) } catch {} } }
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Codex run finished: ${{ job.status }}. Usage: $usage. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 0

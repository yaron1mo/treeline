name: Dispatcher
# Agent office, stage 3 (2026-11-27). Every 3 hours: Sonnet gives ready tasks to free agents and finds stuck work
# (docs/agents/dispatcher.md). Then, if open issues have "needs-spec", Opus writes the specs.
on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '7 8 * * *'    # morning digest 08:07 UTC
  workflow_dispatch:

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the Treeline dispatcher in ${{ github.repository }}. Follow docs/agents/dispatcher.md exactly.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Bash(gh:*),Read,Grep,Glob"

  specs:
    needs: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find issues that need a spec
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo ${{ github.repository }} --state open --label needs-spec --json number --jq 'length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        if: steps.find.outputs.count != '0'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are Claude, CTO of the Treeline team, in ${{ github.repository }}. Open issues with the label needs-spec
            need a full task spec. For each one (at most 2 in this run): read AGENTS.md, docs/agents/office.md, the
            agent spec file, and the issue. Write the full spec in the issue body (goal, files the agent can change,
            steps, check, deliverables), in ASD-STE100, as in docs/agents/mistral.md. Then remove needs-spec and add
            queue:mistral or queue:codex. If the spec needs information that only Yaroslav has (story, names, art
            direction, money), do not guess: add needs:yaroslav and write "@yaron1mo" and the exact question.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Bash(gh:*),Bash(git:*),Read,Grep,Glob"

  digest:
    # Telegram digest after each dispatcher run, 08:00-23:59 London time only (Yaroslav, 2026-11-27).
    needs: [dispatch, specs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send the digest
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          h=$(TZ=Europe/London date +%H)
          if [ "$MANUAL" != "true" ] && [ "$h" -lt 8 ]; then echo "Night: no digest"; exit 0; fi
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "No Telegram secrets"; exit 1; fi
          msg=$(python3 tools/office/digest.py "${{ github.repository }}" 3)
          echo "$msg"
          resp=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${msg}" --data-urlencode "disable_web_page_preview=true")
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("telegram ok:", d.get("ok"), d.get("description", "")); sys.exit(0 if d.get("ok") else 1)'


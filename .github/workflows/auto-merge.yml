name: Auto-merge
# Agent office (2026-11-27). Merges a PR from mistral/** or codex/** into codex/playable-steppe-patch-integration when
# Claude added "ready-to-merge", the PR has no "needs:yaroslav", and all checks pass. Never merges into main.
on:
  pull_request:
    types: [labeled]

jobs:
  merge:
    if: >-
      github.event.label.name == 'ready-to-merge' &&
      github.event.sender.login == 'claude[bot]' &&
      github.event.pull_request.base.ref == 'codex/playable-steppe-patch-integration' &&
      (startsWith(github.head_ref, 'mistral/') || startsWith(github.head_ref, 'codex/')) &&
      !contains(github.event.pull_request.labels.*.name, 'needs:yaroslav')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for the checks, then merge
        run: |
          for i in $(seq 1 100); do
            b=$(gh pr checks "$PR" --repo "$REPO" --json bucket --jq '.[].bucket' 2>/dev/null || true)
            if echo "$b" | grep -q pending; then sleep 30; continue; fi
            break
          done
          if echo "$b" | grep -qE 'fail|cancel'; then
            gh pr comment "$PR" --repo "$REPO" --body "Auto-merge stopped: a check failed. See \`gh pr checks\`."
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --merge
